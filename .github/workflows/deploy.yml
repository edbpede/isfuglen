# Publish the built static site to GitHub Pages at https://isfugl.edb.fi.
#
# The app is `output: "static"` with no adapter, no SSR and no API route, so the
# deployable artefact is exactly `dist/`. peaceiris/actions-gh-pages force-pushes
# that directory to the `gh-pages` branch and writes the CNAME file on every run,
# which is why the custom domain survives a redeploy instead of being reset.
#
# Successful final CI dispatches this publisher for the exact main commit.
# The revision and final CI are checked before publication.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      expected-default-sha:
        description: Exact default-branch commit requested after a checked merge
        type: string
        default: ''

# The default GITHUB_TOKEN needs write access to push the `gh-pages` branch.
permissions:
  contents: write
  actions: read

# Never cancel a deploy in flight: the publish step force-pushes a branch, and
# killing it mid-push is the one way to leave the site in a torn state. Queued
# runs are serialised instead.
concurrency:
  group: deploy-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://isfugl.edb.fi
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v1.0.0
        with:
          token: ${{ github.token }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main" > /tmp/runs.json
          python3 - <<'PYTHON'
          import json, os
          runs = json.load(open('/tmp/runs.json'))['workflow_runs']
          final = next((r for r in runs if r['event'] in {'push', 'workflow_dispatch'}), None)
          if not (final and final['head_sha'] == os.environ['GITHUB_SHA'] and final['head_branch'] == 'main' and final['status'] == 'completed' and final['conclusion'] == 'success'):
              raise SystemExit('Exact main commit has no successful final CI')
          PYTHON
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # Derived from the committed `packageManager` field, not `latest`:
          # a deploy must build with the same toolchain the gates validated.
          bun-version-file: package.json

      # `--frozen-lockfile` so a deploy can never resolve a dependency version
      # that no pull request ever tested.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - uses: edbfi/automation/actions/dispatch-guard@v1.0.0
        with:
          token: ${{ github.token }}
          expected-default-sha: ${{ inputs.expected-default-sha }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Astro emits `_astro/`, and Jekyll drops underscore-prefixed paths.
          # The action writes `.nojekyll` for us as long as Jekyll stays off.
          enable_jekyll: false
          cname: isfugl.edb.fi
