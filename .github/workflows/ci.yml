name: CI

on:
  push:
    branches: [main]
  pull_request:

# The plan repeatedly says a property is "asserted in CI". This is the file that
# makes that true rather than aspirational: catalog parity, the privacy
# interception test, axe-core on every screen, the DOCX structure gate and the
# bundle budget all run here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Hooks, formatting and stack guards
        uses: j178/prek-action@v3
        with:
          extra_args: --all-files --group ci

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Bundle budget
        run: bun run scripts/check-bundle.ts

      - name: Install browsers
        run: bunx --bun playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
