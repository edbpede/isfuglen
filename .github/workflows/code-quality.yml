name: quality
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  quality:
    name: format, lint, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.21.0
    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version-file: package.json
    - uses: actions/cache@v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-
    - name: Install frozen dependencies
      run: bun install --frozen-lockfile
    - name: Complementary prek checks
      uses: j178/prek-action@v3.0.0
      with:
        # renovate: datasource=github-releases depName=j178/prek
        prek-version: 0.5.2
        extra-args: --all-files --hook-stage manual
      env:
        SKIP: no-commit-to-branch,biome,build
    - name: Validate and build
      run: bash .github/scripts/check.sh
    - name: Reject tracked-file mutations
      run: git diff --exit-code HEAD
    - name: Share the validated build
      uses: actions/upload-artifact@v7.0.1
      with:
        name: site-dist
        path: dist/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
